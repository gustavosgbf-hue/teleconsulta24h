name: Bump patient chat v6 cache
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bump-patient-chat-v6-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump asset version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('atendimento/index.html')
          s=p.read_text()
          old='/patient-chat-ux-v6.js?v=6'
          new='/patient-chat-ux-v6.js?v=end-app-7'
          if old not in s:
              raise SystemExit('expected patient chat cache reference not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atendimento/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bust patient chat app CTA cache'
          git push
