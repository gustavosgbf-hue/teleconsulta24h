name: Add Google Play pill to consulta
on:
  push:
    paths:
      - '.github/workflows/add-google-play-pill-consulta.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add discreet Google Play pill below primary CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('consulta/index.html')
          s=p.read_text()
          marker='''  </a>\n  <!-- âncora de preço: comparação com presencial -->'''
          if marker not in s:
              raise SystemExit('Expected hero CTA marker not found; aborting without changes')
          block='''  </a>\n  <a href="https://play.google.com/store/apps/details?id=com.consultaja24h.app" target="_blank" rel="noopener noreferrer" aria-label="Baixar o aplicativo ConsultaJá24h na Google Play" style="display:inline-flex;align-items:center;gap:10px;margin:12px auto 2px;padding:8px 13px;border-radius:14px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.035);color:rgba(255,255,255,.82);text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.16);animation:fadeUp .5s ease both .28s">\n    <svg width="23" height="23" viewBox="0 0 24 24" aria-hidden="true" style="flex:0 0 auto">\n      <path fill="#00D2FF" d="M3.2 2.7c-.2.3-.3.7-.3 1.2v16.2c0 .5.1.9.3 1.2l9.1-9.3-9.1-9.3Z"/>\n      <path fill="#00F076" d="m12.3 12 3-3.1L4.8 3c-.6-.3-1.1-.4-1.6-.3l9.1 9.3Z"/>\n      <path fill="#FFD400" d="m12.3 12-9.1 9.3c.5.1 1 0 1.6-.3l10.5-5.9-3-3.1Z"/>\n      <path fill="#FF3A44" d="m21 10.6-5.7-3.2-3 3.1 3 3.1 5.7-3.2c.8-.4.8-1.2 0-1.8Z"/>\n    </svg>\n    <span style="display:flex;flex-direction:column;align-items:flex-start;line-height:1.08;text-align:left">\n      <span style="font-size:.59rem;font-weight:600;letter-spacing:.035em;color:rgba(255,255,255,.48);text-transform:uppercase">Também no Android</span>\n      <span style="font-size:.77rem;font-weight:700;color:rgba(255,255,255,.86)">Baixe na Google Play</span>\n    </span>\n    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="opacity:.42;margin-left:1px"><path d="m9 18 6-6-6-6"/></svg>\n  </a>\n  <!-- âncora de preço: comparação com presencial -->'''
          s=s.replace(marker,block,1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/add-google-play-pill-consulta.yml
          git add consulta/index.html
          git commit -m 'Add discreet Google Play CTA to consulta'
          git pull --rebase origin main
          git push
