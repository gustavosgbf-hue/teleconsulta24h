name: Apply Checkout Conversion V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-checkout-conversion-v1.mjs'
      - '.github/workflows/apply-checkout-conversion-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply checkout conversion patch
        run: node scripts/apply-checkout-conversion-v1.mjs

      - name: Validate patch
        run: |
          git diff --check
          grep -q "patient_lookup_started_background" consulta/index.html
          grep -q "function moPrepararAtendimentoBackground" consulta/index.html
          grep -q "fast_path:true" consulta/index.html

      - name: Commit optimized checkout
        run: |
          if git diff --quiet -- consulta/index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consulta/index.html
          git commit -m "Optimize checkout path to payment"
          git push
