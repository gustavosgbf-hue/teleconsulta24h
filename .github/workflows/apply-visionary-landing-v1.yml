name: Apply Visionary Landing V1

on:
  push:
    paths:
      - 'scripts/apply-visionary-landing-v1.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply landing patch
        run: node scripts/apply-visionary-landing-v1.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consulta/index.html
          git commit -m "Refresh consulta landing visual system"
          git push
