name: Hotfix waiting screen freeze
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-waiting-freeze.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch recursive waiting observer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('patient-experience-v3.js')
          s=p.read_text()
          old="if(ready){title.textContent='Seu médico chegou';if(sub)sub.textContent='O atendimento já está disponível. Você pode continuar pelo chat abaixo.'}\n    else {if(/notificado|aguard|procur/i.test(title.textContent||''))title.textContent='Estamos chamando seu médico';if(sub)sub.textContent='Seu atendimento está na fila e será assumido assim que o médico ficar disponível.'}"
          new="if(ready){if(title.textContent!=='Seu médico chegou')title.textContent='Seu médico chegou';if(sub&&sub.textContent!=='O atendimento já está disponível. Você pode continuar pelo chat abaixo.')sub.textContent='O atendimento já está disponível. Você pode continuar pelo chat abaixo.'}\n    else {if(/notificado|aguard|procur/i.test(title.textContent||'')&&title.textContent!=='Estamos chamando seu médico')title.textContent='Estamos chamando seu médico';if(sub&&sub.textContent!=='Seu atendimento está na fila e será assumido assim que o médico ficar disponível.')sub.textContent='Seu atendimento está na fila e será assumido assim que o médico ficar disponível.'}"
          if old not in s:
              raise SystemExit('target snippet not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check patient-experience-v3.js
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patient-experience-v3.js
          git commit -m "Fix waiting screen recursive observer freeze"
          git push
