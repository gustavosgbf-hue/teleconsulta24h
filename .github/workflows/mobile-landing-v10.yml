name: Mobile landing v10
on:
  push:
    paths:
      - '.github/workflows/mobile-landing-v10.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile-only landing polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          p=Path('consulta/visionary-v1.js')
          s=p.read_text()
          fn=base64.b64decode('').decode()
          mobile=base64.b64decode('').decode()
          if 'function polishMobileContent()' not in s:
              marker='    function mountVisualPolish(){\n'
              if marker not in s: raise SystemExit('mountVisualPolish marker not found')
              s=s.replace(marker,fn+marker,1)
          pattern=re.compile(r'        @media\(max-width:720px\)\{.*?\n        \}\n(?=      `;)',re.S)
          s,n=pattern.subn(mobile,s,count=1)
          if n!=1: raise SystemExit(f'mobile media block replaced {n} times')
          old='syncTrustNumbers();fixPixStatusVisibility();mountAppPromos();setupHowSection();simplifyMobileIntents();mountVisualPolish();setupVideo();mountDock();'
          new='syncTrustNumbers();fixPixStatusVisibility();mountAppPromos();setupHowSection();simplifyMobileIntents();polishMobileContent();mountVisualPolish();setupVideo();mountDock();'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('init marker not found')
          p.write_text(s)
          idx=Path('consulta/index.html')
          html=idx.read_text()
          html,n=re.subn(r'/consulta/visionary-v1\.js\?v=[^"\']+','/consulta/visionary-v1.js?v=mobile-v10-1',html,count=1)
          if n!=1: raise SystemExit(f'cache marker replaced {n} times')
          idx.write_text(html)
          PY
          node --check consulta/visionary-v1.js
      - name: Commit polished mobile landing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add consulta/visionary-v1.js consulta/index.html
          git commit -m 'Polish mobile landing for conversion and visual hierarchy'
          git pull --rebase origin main
          git push
