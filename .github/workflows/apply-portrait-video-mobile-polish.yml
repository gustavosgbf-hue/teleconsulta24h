name: Apply portrait video and mobile polish
on:
  push:
    paths:
      - '.github/workflows/apply-portrait-video-mobile-polish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply portrait video and mobile conversion polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          desktop='https://pub-93eb63c110d047c681aab7a5b30d2c2b.r2.dev/hero-app.mp4'
          mobile='https://pub-93eb63c110d047c681aab7a5b30d2c2b.r2.dev/hero-appp.mp4'

          # Root homepage: portrait source on mobile, current horizontal video on desktop.
          p=Path('index.html')
          s=p.read_text()
          old=f'''<video class="hero__video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">\n        <source src="{desktop}" type="video/mp4">\n      </video>'''
          new=f'''<video class="hero__video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">\n        <source media="(max-width: 720px)" src="{mobile}" type="video/mp4">\n        <source src="{desktop}" type="video/mp4">\n      </video>'''
          if old in s:
              s=s.replace(old,new,1)
          elif mobile not in s:
              raise SystemExit('root hero video block not found')
          p.write_text(s)

          # /consulta: choose 9:16 source on mobile without touching checkout/payment logic.
          p=Path('consulta/visionary-v1.js')
          s=p.read_text()
          old_line=f"var HERO_VIDEO_URL='{desktop}';"
          new_lines=(f"var HERO_VIDEO_URL='{desktop}';\n"
                     f"    var HERO_MOBILE_VIDEO_URL='{mobile}';")
          if 'HERO_MOBILE_VIDEO_URL' not in s:
              if old_line not in s:
                  raise SystemExit('consulta hero video constant not found')
              s=s.replace(old_line,new_lines,1)
          old_src='video.src=HERO_VIDEO_URL;'
          new_src="video.src=(window.matchMedia&&window.matchMedia('(max-width:720px)').matches)?HERO_MOBILE_VIDEO_URL:HERO_VIDEO_URL;"
          if new_src not in s:
              if old_src not in s:
                  raise SystemExit('consulta video src assignment not found')
              s=s.replace(old_src,new_src,1)
          # Delay sticky slightly so trust content gets a chance before the dock dominates.
          s=s.replace("window.scrollY>260","window.scrollY>420")
          p.write_text(s)

          # Strong mobile-only cleanup. No checkout, payment, modal or triage behavior is changed.
          p=Path('consulta/visionary-v1.css')
          s=p.read_text()
          marker='/* MOBILE PORTRAIT CONVERSION POLISH v1 */'
          if marker not in s:
              s += r'''

/* MOBILE PORTRAIT CONVERSION POLISH v1 */
@media (max-width:720px){
  html body{background:#f4f7f5!important;color:#15211d!important}

  html body .nav{
    min-height:58px!important;
    background:rgba(7,16,15,.88)!important;
    border-bottom:1px solid rgba(255,255,255,.07)!important;
    box-shadow:none!important;
    backdrop-filter:blur(18px)!important;
    -webkit-backdrop-filter:blur(18px)!important;
  }
  html body .nav__in{
    min-height:58px!important;height:58px!important;
    padding:8px 14px!important;
    display:flex!important;flex-direction:row!important;
    align-items:center!important;justify-content:space-between!important;
  }
  html body .nav__links{display:none!important}
  html body .nav__logo{font-size:.88rem!important}
  html body .nav__cta-link{
    min-height:38px!important;padding:8px 13px!important;border-radius:12px!important;
    background:#f6f8f7!important;color:#10231a!important;
    border:1px solid rgba(255,255,255,.54)!important;
    box-shadow:none!important;font-size:.72rem!important;
  }

  html body .hero{
    position:relative!important;
    min-height:calc(100svh - 58px)!important;
    padding:44px 18px 34px!important;
    justify-content:flex-end!important;
    align-items:stretch!important;
    text-align:left!important;
    background:#08110f!important;
  }
  html body .cj-hero-bg-video{
    position:absolute!important;inset:0!important;width:100%!important;height:100%!important;
    object-fit:cover!important;object-position:center center!important;
    filter:brightness(.53) saturate(.58) contrast(1.03)!important;
  }
  html body .hero::before{
    inset:0!important;width:auto!important;height:auto!important;left:0!important;top:0!important;
    transform:none!important;filter:none!important;
    background:linear-gradient(180deg,rgba(5,12,10,.18) 0%,rgba(5,12,10,.30) 28%,rgba(5,12,10,.78) 62%,rgba(5,12,10,.98) 100%)!important;
  }
  html body .hero::after{display:none!important}
  html body .hero>*:not(.cj-hero-bg-video){position:relative!important;z-index:2!important}
  html body #heroBadge,html body .doc-card,html body .cj-play-hero{display:none!important}
  html body .hero h1,html body .hero__title{
    margin:0!important;max-width:345px!important;
    font-size:clamp(2.02rem,9.5vw,2.48rem)!important;
    line-height:1.00!important;letter-spacing:-.048em!important;
    font-weight:750!important;text-align:left!important;color:#f8faf9!important;
  }
  html body .hero__sub{
    margin:14px 0 0!important;max-width:340px!important;
    font-size:.9rem!important;line-height:1.45!important;
    color:rgba(248,250,249,.74)!important;text-align:left!important;
  }
  html body #heroCTA,html body .hero__cta{width:100%!important;max-width:none!important;margin-top:19px!important}
  html body #heroCTA,html body .hero__cta-btn,html body .hero__cta button,html body .hero__cta a{
    width:100%!important;min-height:58px!important;border-radius:15px!important;
    background:#f7f9f8!important;color:#10231a!important;
    border:1px solid rgba(255,255,255,.62)!important;
    box-shadow:0 14px 34px rgba(0,0,0,.28)!important;
    font-size:1rem!important;font-weight:850!important;
  }
  html body #heroCTA svg,html body .hero__cta svg{color:#176b4f!important;stroke:#176b4f!important}

  html body .hero__intent{margin-top:16px!important;width:100%!important}
  html body .hero__intent-title{
    margin-bottom:8px!important;text-align:left!important;
    font-size:.69rem!important;color:rgba(248,250,249,.62)!important;
  }
  html body .hero__intent-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}
  html body .hero__intent-btn{
    min-height:42px!important;padding:8px 8px!important;border-radius:12px!important;
    background:rgba(5,14,11,.48)!important;border:1px solid rgba(255,255,255,.13)!important;
    color:#eef5f1!important;font-size:.66rem!important;box-shadow:none!important;
  }
  html body .hero__intent-btn--primary{
    background:rgba(141,200,174,.12)!important;border-color:rgba(176,218,198,.25)!important;
  }
  html body .hero__intent-btn--primary::after{display:none!important}
  html body .hero__intent-btn:nth-child(n+5){display:none!important}
  html body #heroUrgency{display:none!important}
  html body #heroPriceAnchor{margin-top:11px!important}
  html body .hero__proof-list{margin-top:10px!important;gap:5px!important}
  html body .hero__proof-row{justify-content:flex-start!important;font-size:.68rem!important;color:rgba(244,249,246,.72)!important}
  html body #heroReviewProof{margin-top:9px!important;justify-content:flex-start!important;text-align:left!important;font-size:.67rem!important;color:rgba(244,249,246,.70)!important}
  html body #heroSecurity{margin-top:7px!important;text-align:left!important;font-size:.61rem!important;color:rgba(244,249,246,.50)!important}

  html body .reviews-section{
    padding:42px 0 38px!important;background:#f4f7f5!important;color:#15211d!important;
  }
  html body .reviews-section .section-label{color:#176b4f!important}
  html body .reviews-section .section-title{
    color:#15211d!important;font-size:1.8rem!important;line-height:1.04!important;padding:0 18px!important;
  }
  html body #reviewsBadge{
    margin-top:10px!important;background:#e8f1ed!important;border-color:#c8ddd4!important;color:#176b4f!important;
  }
  html body #reviewsBadgeTxt{color:#176b4f!important;font-size:.7rem!important}
  html body .reviews-section .car-outer{margin-top:18px!important}
  html body .reviews-section .car-vp{
    overflow-x:auto!important;padding:0 18px 5px!important;margin:0!important;
    scroll-snap-type:x mandatory!important;scrollbar-width:none!important;
  }
  html body .reviews-section .car-vp::-webkit-scrollbar{display:none!important}
  html body .reviews-section .car-tk{display:flex!important;gap:10px!important;width:max-content!important;transform:none!important}
  html body .reviews-section .rcard{
    flex:0 0 min(82vw,302px)!important;min-height:0!important;padding:17px 16px!important;
    border-radius:18px!important;background:#fff!important;border:1px solid rgba(21,33,29,.08)!important;
    box-shadow:0 10px 26px rgba(22,45,36,.06)!important;scroll-snap-align:start!important;
  }
  html body .reviews-section .rcard *{text-shadow:none!important}
  html body .reviews-section .rcard__name{color:#15211d!important}
  html body .reviews-section .rcard__quote{color:#596861!important;font-size:.78rem!important;line-height:1.5!important}

  /* Specialists add visual noise on paid-traffic mobile; reviews already provide trust. */
  html body .doctor-strip{display:none!important}

  html body .pain-section,html body .how-section,html body .price-section,html body .faq-section{
    padding:44px 16px!important;
  }
  html body .section-title{font-size:1.68rem!important;line-height:1.07!important;letter-spacing:-.035em!important}
  html body .section-sub{font-size:.84rem!important;line-height:1.52!important}
  html body .steps{grid-template-columns:1fr!important;gap:9px!important}
  html body .step{
    grid-template-columns:44px minmax(0,1fr)!important;padding:14px!important;border-radius:16px!important;
    background:#fff!important;border:1px solid rgba(21,33,29,.08)!important;box-shadow:none!important;
  }
  html body .step__num{
    width:40px!important;height:40px!important;border-radius:12px!important;
    background:#176b4f!important;color:#fff!important;font-size:.92rem!important;
  }
  html body .step h3{font-size:.9rem!important;color:#15211d!important}
  html body .step p{font-size:.76rem!important;color:#65736d!important}

  html body .cj-conversion-dock{
    bottom:8px!important;width:calc(100% - 16px)!important;min-height:58px!important;
    border-radius:16px!important;padding:7px 7px 7px 12px!important;
    background:rgba(248,250,249,.97)!important;border:1px solid rgba(21,33,29,.10)!important;
    box-shadow:0 14px 34px rgba(0,0,0,.18)!important;
    display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:8px!important;
  }
  html body .cj-conversion-dock__title{font-size:.72rem!important;color:#15211d!important;font-weight:800!important}
  html body .cj-conversion-dock__sub{font-size:.61rem!important;color:#74817b!important}
  html body .cj-conversion-dock__btn{
    min-height:44px!important;padding:0 14px!important;border-radius:11px!important;
    background:#176b4f!important;color:#fff!important;font-size:.72rem!important;box-shadow:none!important;
  }
}
'''
          p.write_text(s)

          # Force the updated assets on /consulta so iOS/Safari does not keep the old visual layer.
          p=Path('consulta/index.html')
          s=p.read_text()
          s=re.sub(r'/consulta/visionary-v1\.css\?v=[^"\']+', '/consulta/visionary-v1.css?v=portrait-mobile-1', s)
          s=re.sub(r'/consulta/visionary-v1\.js\?v=[^"\']+', '/consulta/visionary-v1.js?v=portrait-mobile-1', s)
          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html consulta/index.html consulta/visionary-v1.js consulta/visionary-v1.css
          git diff --cached --quiet && exit 0
          git commit -m 'Use portrait hero video and refine mobile conversion landing'
          git pull --rebase origin main
          git push
