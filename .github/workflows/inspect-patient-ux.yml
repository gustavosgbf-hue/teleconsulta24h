name: Inspect patient UX
on:
  push:
    paths:
      - '.github/workflows/inspect-patient-ux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect selectors
        run: |
          echo '--- chat / espera selectors ---'
          grep -nE "chat-consulta|esperaTitulo|esperaSub|esperaAnim|mensagem|input|enviar|composer|chatMensagens|mensagensChat|chatBox" atendimento/index.html | head -n 220
          echo '--- patient v3 script refs ---'
          grep -nE "patient-experience-v3|cj-access|cj-return|cj-sheet" atendimento/index.html | head -n 220
