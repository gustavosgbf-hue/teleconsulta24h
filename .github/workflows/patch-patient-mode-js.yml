name: Patch patient consultation mode JS
on:
  push:
    paths:
      - '.github/workflows/patch-patient-mode-js.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch JS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('patient-experience-v3.js')
          s=p.read_text()
          marker='/* CJ24H v4 consultation mode */'
          if marker not in s:
              insert="""  /* CJ24H v4 consultation mode */
  var cjConsultWasActive=false;
  function syncConsultMode(){
    var section=document.getElementById('s-espera');
    var chat=document.getElementById('chatConsulta');
    if(!section||!chat)return;
    var active=chat.classList.contains('ativo');
    section.classList.toggle('cj-consult-active',active);
    var step=document.getElementById('nav-step');
    if(step){
      if(active)step.textContent='CONSULTA ATIVA';
      else if((step.textContent||'').toUpperCase()==='CONSULTA ATIVA')step.textContent='AGUARDANDO MÉDICO';
    }
    if(active&&!cjConsultWasActive){
      requestAnimationFrame(function(){
        var msgs=document.getElementById('chatMsgs');
        if(msgs)msgs.scrollTop=msgs.scrollHeight;
      });
    }
    cjConsultWasActive=active;
  }

"""
              needle='  function boot(){'
              if needle not in s:
                  raise SystemExit('boot function not found')
              s=s.replace(needle,insert+needle,1)
              old="    var badgeIcon=document.getElementById('esperaBadgeIcon');if(badgeIcon)badgeIcon.textContent='';\n  }"
              new="    var badgeIcon=document.getElementById('esperaBadgeIcon');if(badgeIcon)badgeIcon.textContent='';\n    syncConsultMode();\n  }"
              if old not in s:
                  raise SystemExit('cleanWaitingState tail not found')
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          node --check patient-experience-v3.js
          grep -q "syncConsultMode" patient-experience-v3.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patient-experience-v3.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Switch patient view into focused consultation mode"
          git push
