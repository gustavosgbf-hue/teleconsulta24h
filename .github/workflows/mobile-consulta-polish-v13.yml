name: Mobile consulta polish v13
on:
  push:
    paths:
      - '.github/workflows/mobile-consulta-polish-v13.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile-first landing polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove app diversion from /consulta hero. Conversion page should have one primary job.
          js = Path('consulta/visionary-v1.js')
          s = js.read_text()
          s = s.replace('    mountAppPromo();\n', '')
          js.write_text(s)

          # Append a stronger mobile-only layer; desktop stays as-is.
          css = Path('consulta/visionary-v1.css')
          c = css.read_text()
          marker = '/* cj mobile conversion polish v13 */'
          if marker not in c:
            c += r'''

/* cj mobile conversion polish v13 */
@media(max-width:720px){
  html body .nav__in{padding:9px 12px!important}
  html body .nav__logo{font-size:.9rem!important}
  html body .nav__cta-link{min-height:38px!important;padding:8px 12px!important;font-size:.72rem!important}

  html body .hero{
    min-height:auto!important;
    padding:34px 14px 30px!important;
    text-align:left!important;
    align-items:stretch!important;
  }
  html body .cj-hero-bg-video{
    object-position:61% center!important;
    filter:brightness(.55) saturate(.52) contrast(1.04)!important;
  }
  html body .hero::before{
    background:linear-gradient(180deg,rgba(5,12,10,.46) 0%,rgba(5,12,10,.76) 38%,rgba(5,12,10,.95) 100%)!important;
  }
  html body #heroBadge{display:none!important}
  html body .hero h1,
  html body .hero__title{
    margin:0!important;
    max-width:355px!important;
    font-size:clamp(2.05rem,9.6vw,2.75rem)!important;
    line-height:.99!important;
    letter-spacing:-.05em!important;
    text-align:left!important;
  }
  html body .hero__sub{
    margin-left:0!important;
    margin-right:0!important;
    max-width:350px!important;
    font-size:.91rem!important;
    line-height:1.48!important;
    text-align:left!important;
    color:rgba(244,249,246,.78)!important;
  }
  html body #heroCTA,
  html body .hero__cta{max-width:none!important;width:100%!important}
  html body .hero__cta-btn,
  html body .hero__cta button,
  html body .hero__cta a{
    width:100%!important;
    min-height:56px!important;
    border-radius:14px!important;
    font-size:.96rem!important;
    box-shadow:0 15px 34px rgba(0,0,0,.25)!important;
  }
  html body .hero__intent{margin-top:14px!important;width:100%!important}
  html body .hero__intent-title{text-align:left!important;font-size:.69rem!important;margin-bottom:8px!important}
  html body .hero__intent-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}
  html body .hero__intent-btn{min-height:42px!important;padding:8px 7px!important;border-radius:12px!important;font-size:.66rem!important}
  html body .hero__intent-btn--primary::after{display:none!important}

  html body #heroUrgency{display:none!important}
  html body #heroPriceAnchor{margin-top:12px!important}
  html body #heroReviewProof{margin-top:9px!important;font-size:.69rem!important;justify-content:flex-start!important;text-align:left!important}
  html body #heroSecurity{margin-top:8px!important;font-size:.64rem!important;text-align:left!important}
  html body .hero__proof-list{margin-top:10px!important;gap:6px!important}
  html body .hero__proof-row{justify-content:flex-start!important;font-size:.7rem!important}
  html body .doc-card{display:none!important}
  html body .cj-play-hero{display:none!important}

  html body .reviews-section--near-cta{padding-top:42px!important}
  html body .pain-section,
  html body .how-section,
  html body .price-section,
  html body .reviews-section,
  html body .faq-section{padding:46px 15px!important}
  html body .section-title{font-size:1.72rem!important;line-height:1.06!important}
  html body .section-sub{font-size:.86rem!important}

  html body .steps{grid-template-columns:1fr!important;gap:9px!important}
  html body .step{grid-template-columns:44px 1fr!important;padding:15px 14px!important;border-radius:16px!important}
  html body .step__num{width:40px!important;height:40px!important;border-radius:12px!important;font-size:.95rem!important}
  html body .step h3{font-size:.9rem!important}
  html body .step p{font-size:.76rem!important}

  html body .cj-conversion-dock{
    bottom:9px!important;
    width:calc(100% - 16px)!important;
    border-radius:15px!important;
    padding:8px!important;
  }
  html body .cj-conversion-dock__btn{min-height:44px!important;border-radius:11px!important;font-size:.76rem!important}
}
@media(max-width:430px){
  html body .hero__intent-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}
'''
          css.write_text(c)

          # Force browsers to pick the current visual assets.
          idx = Path('consulta/index.html')
          h = idx.read_text()
          h = re.sub(r'/consulta/visionary-v1\.css\?v=[^"\']+', '/consulta/visionary-v1.css?v=premium-mobile-v13-1', h, count=1)
          h = re.sub(r'/consulta/visionary-v1\.js\?v=[^"\']+', '/consulta/visionary-v1.js?v=premium-mobile-v13-1', h, count=1)
          idx.write_text(h)
          PY
          node --check consulta/visionary-v1.js
          git diff --check
      - name: Commit mobile-first polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/mobile-consulta-polish-v13.yml
          git add consulta/visionary-v1.css consulta/visionary-v1.js consulta/index.html
          git commit -m 'Polish consultation landing for mobile conversion'
          git pull --rebase origin main
          git push