name: Fix entity one time
on:
  push:
    paths:
      - '.github/workflows/fix-entity-one-time.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "from pathlib import Path; p=Path('patient-experience-v3.js'); s=p.read_text(); s=s.replace(\"'\\\"':'&quot'\",\"'\\\"':'&quot;'\",1); p.write_text(s)"
      - run: node --check patient-experience-v3.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patient-experience-v3.js
          git commit -m "Fix patient HTML entity escaping" || exit 0
          git push
