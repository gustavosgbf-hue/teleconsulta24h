name: Patch Meta attribution in consulta landing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-meta-attribution.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture fbclid with existing attribution params
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('consulta/index.html')
          s = p.read_text(encoding='utf-8')
          old = "['gclid','gbraid','wbraid','debug_tag','force_tag'].indexOf(chave)>=0"
          new = "['gclid','gbraid','wbraid','fbclid','debug_tag','force_tag'].indexOf(chave)>=0"
          if old not in s:
              raise SystemExit('Expected attribution allow-list not found; refusing to edit landing.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit landing change and remove one-shot workflow
        run: |
          rm -f .github/workflows/patch-meta-attribution.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add consulta/index.html .github/workflows/patch-meta-attribution.yml
          git commit -m 'Captura fbclid na landing /consulta'
          git push
