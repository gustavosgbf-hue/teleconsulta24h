name: Bump landing visionary cache
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bump-landing-visionary-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('consulta/index.html')
          s=p.read_text()
          old='/consulta/visionary-v1.js?v=1'
          new='/consulta/visionary-v1.js?v=2'
          if old not in s:
              raise SystemExit('expected visionary v1 reference not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add consulta/index.html
          git commit -m 'Bust landing visionary cache'
          git push
