name: Bump landing visionary cache
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bump-landing-visionary-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh landing asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('consulta/index.html')
          s=p.read_text()
          s=s.replace('/consulta/visionary-v1.css?v=dark-app-2','/consulta/visionary-v1.css?v=premium-mobile-14')
          s=s.replace('/consulta/visionary-v1.js?v=mobile-v12-1','/consulta/visionary-v1.js?v=premium-mobile-14')
          p.write_text(s)
          PY
      - name: Commit cache refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add consulta/index.html
          git commit -m 'Refresh consultation landing asset cache'
          git pull --rebase origin main
          git push
