name: Use lightweight root hero
on:
  push:
    paths:
      - '.github/workflows/use-lightweight-root-hero.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace root hero video only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''<video class="hero__video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">\n        <source media="(max-width: 720px)" src="https://pub-93eb63c110d047c681aab7a5b30d2c2b.r2.dev/hero-appp.mp4" type="video/mp4">\n        <source src="https://pub-93eb63c110d047c681aab7a5b30d2c2b.r2.dev/hero-app.mp4" type="video/mp4">\n      </video>'''
          new='''<video class="hero__video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">\n        <source src="https://pub-93eb63c110d047c681aab7a5b30d2c2b.r2.dev/hero-app-web.mp4" type="video/mp4">\n      </video>'''
          if old not in s:
              raise SystemExit('Expected root hero block not found; refusing to touch anything else')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit root-only change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use lightweight hero video on homepage'
          git pull --rebase origin main
          git push
