name: Add Google Play click tracking

on:
  push:
    paths:
      - '.github/workflows/add-google-play-click-tracking.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch homepage tracking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""      document.querySelectorAll('.js-app-link').forEach(function(a){
        a.href=playUrl();
        a.addEventListener('click',function(){track('app_download_click',{placement:(a.textContent||'').trim(),device:isIOS?'ios':'other'})});
      });
"""
          new="""      document.querySelectorAll('.js-app-link').forEach(function(a){
        a.href=playUrl();
        a.addEventListener('click',function(){
          var placement=(a.textContent||'').trim();
          if(isIOS){
            track('web_continue_click',{placement:placement,source:'ios_app_fallback'});
            return;
          }
          var detail={placement:placement,device:'non_ios',link_url:a.href};
          track('google_play_click',detail);
          track('app_download_click',detail);
        });
      });
"""
          if old not in s:
              raise SystemExit('Expected app tracking block not found; aborting without changes')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check

      - name: Commit and clean up workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/add-google-play-click-tracking.yml
          git add index.html
          git commit -m 'Track Google Play CTA clicks on homepage'
          git pull --rebase origin main
          git push origin HEAD:main
