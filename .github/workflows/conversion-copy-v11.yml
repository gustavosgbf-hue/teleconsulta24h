name: Conversion copy v11
on:
  push:
    paths:
      - '.github/workflows/conversion-copy-v11.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply landing conversion copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('consulta/visionary-v1.js')
          s=p.read_text()
          s=s.replace('<strong>Prefere usar o aplicativo?</strong><small>Consultas e documentos no celular</small>','<strong>Também temos aplicativo</strong><small>Baixe na Google Play para consultar e acessar documentos</small>')
          s=re.sub(r"if\(sub\)sub\.textContent='[^']*';", "if(sub)sub.textContent='Chat ou vídeo. R$49,90 por consulta. Sem mensalidade.';", s, count=1)
          s=re.sub(r"if\(intentTitle\)intentTitle\.textContent='[^']*';", "if(intentTitle)intentTitle.textContent='O que você precisa hoje?';", s, count=1)
          if 'function mountValueProof()' not in s:
              marker='    function mountVisualPolish(){\n'
              fn=("    function mountValueProof(){\n"
                  "      var cta=document.getElementById('heroCTA');\n"
                  "      if(!cta||document.querySelector('.cj-value-proof'))return;\n"
                  "      var proof=document.createElement('div');\n"
                  "      proof.className='cj-value-proof';\n"
                  "      proof.innerHTML='<div class=\"cj-value-proof__item\"><strong>Pague só quando precisar</strong><span>sem assinatura</span></div><div class=\"cj-value-proof__item\"><strong>~5 min no chat¹</strong><span>espera típica</span></div><small class=\"cj-value-proof__note\">¹ Mediana das consultas clínicas por chat nos últimos 30 dias.</small>';\n"
                  "      cta.insertAdjacentElement('afterend',proof);\n"
                  "      if(!document.getElementById('cj-value-proof-style')){\n"
                  "        var st=document.createElement('style');st.id='cj-value-proof-style';\n"
                  "        st.textContent='.cj-value-proof{display:none}@media(max-width:720px){.cj-value-proof{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px auto 0;max-width:430px;width:100%}.cj-value-proof__item{min-width:0;padding:8px 9px;border:1px solid rgba(120,230,165,.12);border-radius:11px;background:rgba(255,255,255,.018);text-align:left}.cj-value-proof__item strong{display:block;font:650 10.8px/1.2 Outfit,sans-serif;color:#eaf6ec}.cj-value-proof__item span{display:block;margin-top:2px;font:500 9px/1.2 Outfit,sans-serif;color:#81958a}.cj-value-proof__note{grid-column:1/-1;margin-top:-1px;text-align:center;font:400 8.3px/1.3 Outfit,sans-serif;color:#5f7569}}';\n"
                  "        document.head.appendChild(st);\n"
                  "      }\n"
                  "    }\n\n")
              if marker not in s: raise SystemExit('mountVisualPolish marker not found')
              s=s.replace(marker,fn+marker,1)
          old='syncTrustNumbers();fixPixStatusVisibility();mountAppPromos();setupHowSection();simplifyMobileIntents();polishMobileContent();mountVisualPolish();setupVideo();mountDock();'
          new='syncTrustNumbers();fixPixStatusVisibility();mountAppPromos();setupHowSection();simplifyMobileIntents();polishMobileContent();mountValueProof();mountVisualPolish();setupVideo();mountDock();'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('landing init marker not found')
          p.write_text(s)
          idx=Path('consulta/index.html')
          html=idx.read_text()
          html,n=re.subn(r'/consulta/visionary-v1\.js\?v=[^"\']+','/consulta/visionary-v1.js?v=conversion-v11-1',html,count=1)
          if n!=1: raise SystemExit('cache marker not found')
          idx.write_text(html)
          PY
          node --check consulta/visionary-v1.js
          git diff --check
      - name: Commit landing changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/conversion-copy-v11.yml
          git add consulta/visionary-v1.js consulta/index.html
          git commit -m 'Strengthen landing price and wait-time proof'
          git pull --rebase origin main
          git push
