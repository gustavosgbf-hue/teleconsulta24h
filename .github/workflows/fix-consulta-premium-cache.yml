name: Fix consulta premium cache
on:
  push:
    paths:
      - '.github/workflows/fix-consulta-premium-cache.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh premium assets and remove app distraction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js = Path('consulta/visionary-v1.js')
          s = js.read_text()
          s = s.replace('mountAppPromo();','')
          js.write_text(s)

          idx = Path('consulta/index.html')
          h = idx.read_text()
          h, n1 = re.subn(r'/consulta/visionary-v1\.css\?v=[^"\']+', '/consulta/visionary-v1.css?v=premium-video-4', h, count=1)
          h, n2 = re.subn(r'/consulta/visionary-v1\.js\?v=[^"\']+', '/consulta/visionary-v1.js?v=premium-video-4', h, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'cache markers not found css={n1} js={n2}')
          idx.write_text(h)
          PY
          node --check consulta/visionary-v1.js
          git diff --check
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-consulta-premium-cache.yml
          git add consulta/visionary-v1.js consulta/index.html
          git commit -m 'Refresh consultation premium assets and focus CTA'
          git pull --rebase origin main
          git push