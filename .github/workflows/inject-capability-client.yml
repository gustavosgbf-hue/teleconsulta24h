name: Inject attendance capability client

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/paciente-lookup-no-pii
          fetch-depth: 0

      - name: Inject capability client before page scripts
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('index.html'),
              Path('consulta/index.html'),
              Path('atendimento/index.html'),
              Path('triagem/index.html'),
              Path('triagem.html'),
          ]
          tag = '<script src="/atendimento-capability.js?v=1"></script>'

          for path in files:
              text = path.read_text(encoding='utf-8')
              if tag in text:
                  continue
              marker = '<head>'
              if marker not in text:
                  raise SystemExit(f'{path}: <head> não encontrado')
              text = text.replace(marker, marker + '\n' + tag, 1)
              path.write_text(text, encoding='utf-8')
              print('updated', path)
          PY

      - name: Validate injected files
        run: |
          for f in index.html consulta/index.html atendimento/index.html triagem/index.html triagem.html; do
            grep -q 'atendimento-capability.js?v=1' "$f"
          done
          git diff --check

      - name: Commit branch-only integration
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html consulta/index.html atendimento/index.html triagem/index.html triagem.html
          git commit -m '[capability-inject] Load attendance capability client in web flow'
          git push origin HEAD:security/paciente-lookup-no-pii
