name: Fix patient PWA JS polish v2
on:
  push:
    paths:
      - '.github/workflows/fix-patient-pwa-js-polish-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_patient_pwa_js_and_polish_v2.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atendimento/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix patient PWA push JS and polish chat UX"
          git push
